name: Mise a jour quotidienne stations

on:
  schedule:
    - cron: '0 3 * * *'   # Tous les jours a 3h UTC
  workflow_dispatch:        # Permet de lancer manuellement depuis GitHub

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Synchroniser la branche
        run: git pull --rebase origin main

      - name: Generer le fichier statique carburants
        run: python generate_static.py --output json

      - name: Compresser le fichier carburants
        run: gzip -9 -f stations_static.json

      - name: Generer le fichier statique bornes electriques
        run: python generate_electric_static.py

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations_static.json.gz stations_electrique_static.json.gz
          if git diff --cached --quiet; then
            echo "Aucun changement de donnees a publier."
          else
            git commit -m "Data: mise a jour stations $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
